# /etc/nginx/sites-available/catalogos.cosmobeauty.pt
# Site estático: o conteúdo de `dist/` é copiado para /var/www/catalogos

server {
    listen 80;
    listen [::]:80;
    server_name catalogos.cosmobeauty.pt;

    root /var/www/catalogos;
    index index.html;

    # Segurança básica
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Compressão
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Ficheiros com hash no nome (JS, CSS, fontes): cache de 1 ano
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Logótipos e imagens: cache de 7 dias
    location ~* \.(png|svg|jpg|jpeg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # index.html sem cache, para que alterações aos catálogos apareçam logo
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
